# =============================================================================
# Random Forest model configuration.
# Deep-merged on top of default.yaml — only overrides / additions live here.
# =============================================================================

model:
  name: "random_forest"
  base_params:
    n_estimators: 200
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "sqrt"
    class_weight: "balanced"
    n_jobs: -1

  param_grid:
    n_estimators: [100, 200, 300]
    max_depth: [null, 10, 20, 30]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
    max_features: ["sqrt", "log2"]

tuning:
  scoring: "f1"
  cv_folds: 5
